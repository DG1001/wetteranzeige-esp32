; Sunton ESP32-8048S043 (ESP32-S3-WROOM-1 N16R8, 4.3" 800x480 RGB, GT911 Touch)
; Arduino-Core 3.x (ESP-IDF 5.x) über pioarduino: nötig für den Bounce Buffer des RGB-Treibers
[env:esp32-8048s043]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

; Empfehlungen von Espressif gegen springendes Bild bei RGB-Displays (ESP-FAQ, LCD):
; 64-Byte-Cache-Zeilen für den Bounce Buffer, Code aus dem PSRAM statt dem Flash ausführen
; (Flash-Schreibzugriffe blockieren den PSRAM dann nicht mehr) und Display-Interrupt im IRAM
custom_sdkconfig =
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.0
